name: Release

# Publishes to npm when a v* tag is pushed.
#
# Flow (matches the pre-tag discipline used across the Hepein ecosystem):
#   1. push to main (no tag)  → CI must be green
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. this workflow re-verifies everything, then publishes
#
# Setup required once, in repo Settings → Secrets → Actions:
#   NPM_TOKEN — an npm automation token with publish rights on @brashkie

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check but skip the actual npm publish'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  # ─── Re-verify: never publish something that wasn't fully checked ────────
  verify:
    name: Verify — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ─── Guard: tag must match package.json version ──────────────────────────
  # Prevents the classic mistake of tagging v0.2.0 while package.json says 0.1.0.
  version-check:
    name: Tag ↔ package.json match
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag against package.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "Tag version:          $TAG"
          echo "package.json version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Fix the version and re-tag."
            exit 1
          fi
          echo "Versions match."

  # ─── Publish to npm ──────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, version-check]
    # Only publish on a real tag push, never on the dry-run dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Release with notes ──────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## @brashkie/signalis-noise ${{ github.ref_name }}

            ```bash
            npm install @brashkie/signalis-noise@${{ github.ref_name }}
            ```

            See [CHANGELOG.md](https://github.com/Brashkie/signalis-noise/blob/main/CHANGELOG.md) for details.
